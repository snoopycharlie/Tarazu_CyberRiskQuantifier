services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tarazu
      POSTGRES_USER: tarazu
      POSTGRES_PASSWORD: tarazu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarazu -d tarazu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://tarazu:tarazu@postgres:5432/tarazu
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      NVD_API_BASE: ${NVD_API_BASE:-https://services.nvd.nist.gov/rest/json/cves/2.0}
      NVD_API_TIMEOUT: ${NVD_API_TIMEOUT:-15}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://frontend:80
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      API_KEY_TENANTS: ${API_KEY_TENANTS:?Set a tenant-scoped API key mapping before starting production}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      API_PROXY_KEY: ${API_PROXY_KEY:?Set the API key used by the frontend proxy}
    depends_on:
      - backend

volumes:
  pgdata:
